<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Detail — KinoVibe</title>
  <meta name="description" content="View your detailed movie review with scores and bias breakdown.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="library.html" class="nav-brand">
        <span class="brand-kino">Kino</span><span class="brand-vibe">Vibe</span>
      </a>
      <div class="nav-links">
        <a href="library.html" class="nav-link">Library</a>
        <a href="tiers.html" class="nav-link">Tiers</a>
        <a href="matrix.html" class="nav-link">Matrix</a>
        <a href="add.html" class="nav-link nav-add">+ Add Movie</a>
      </div>
    </div>
  </nav>

  <main class="page-container" style="max-width:760px">
    <a href="library.html" class="back-link">← Back to Library</a>

    <!-- TMDB Backdrop Hero -->
    <div id="backdrop-container"></div>

    <!-- Detail Hero -->
    <div class="detail-hero fade-in" id="detail-hero">
      <div class="detail-poster" id="detail-poster">
        <div class="poster-fallback" id="poster-fallback">?</div>
      </div>
      <div class="detail-info">
        <div class="detail-title" id="detail-title">—</div>
        <div class="detail-year" id="detail-year">—</div>
        <div class="flex flex-wrap gap-2 mt-2" id="detail-genres"></div>
        <div class="detail-tags-row" id="detail-tags"></div>
      </div>
      <div class="detail-score">
        <div class="score-big" id="detail-final-score">—</div>
        <div class="score-label">Final score</div>
      </div>
    </div>

    <!-- Stat Grid with Progress Meters -->
    <div class="stat-grid fade-in" style="--delay:0.1s" id="stat-grid">
      <div class="stat-box">
        <div class="stat-num text-sky-400" id="stat-story">—</div>
        <div class="stat-label">Story</div>
        <div class="stat-meter"><div class="stat-meter-fill story" id="meter-story" style="width:0%"></div></div>
      </div>
      <div class="stat-box">
        <div class="stat-num text-purple-400" id="stat-visuals">—</div>
        <div class="stat-label">Visuals</div>
        <div class="stat-meter"><div class="stat-meter-fill visuals" id="meter-visuals" style="width:0%"></div></div>
      </div>
      <div class="stat-box">
        <div class="stat-num text-orange-400" id="stat-action">—</div>
        <div class="stat-label">Action</div>
        <div class="stat-meter"><div class="stat-meter-fill action" id="meter-action" style="width:0%"></div></div>
      </div>
      <div class="stat-box">
        <div class="stat-num text-emerald-400" id="stat-fun">—</div>
        <div class="stat-label">Fun</div>
        <div class="stat-meter"><div class="stat-meter-fill fun" id="meter-fun" style="width:0%"></div></div>
      </div>
    </div>

    <!-- Score Summary -->
    <div class="score-summary fade-in" style="--delay:0.15s" id="score-summary">
      <div><span style="color:var(--text-muted)">Base score</span> <strong id="base-score">—</strong></div>
      <div><span style="color:var(--text-muted)">Total bias</span> <strong id="total-bias">—</strong></div>
    </div>

    <!-- Bias Details -->
    <div class="fade-in" style="--delay:0.2s" id="bias-section">
      <div class="section-title">Bias Details</div>
      <div id="bias-pills" style="margin-bottom:2rem"></div>
    </div>

    <!-- Synopsis -->
    <div class="fade-in hidden" style="--delay:0.22s" id="overview-section">
      <div class="section-title">Synopsis</div>
      <p class="review-text" id="overview-text" style="margin-bottom:2rem; font-style: italic; opacity: 0.9;"></p>
    </div>

    <!-- Written Review -->
    <div class="fade-in" style="--delay:0.25s" id="review-section">
      <div class="section-title">Written Review</div>
      <p class="review-text" id="review-text" style="margin-bottom:3rem"></p>
    </div>

    <!-- Actions -->
    <div class="fade-in flex gap-2.5 mb-12" style="--delay:0.3s">
      <a href="#" class="btn-primary" id="edit-btn">Edit Review</a>
      <button class="btn-danger" id="delete-btn">Delete</button>
    </div>
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="sm:hidden fixed bottom-0 left-0 right-0 z-50 bg-kino-surface/95 backdrop-blur-lg border-t border-white/[0.08] px-4 py-2 flex justify-around items-center">
    <a href="library.html" class="flex flex-col items-center gap-1 text-xs text-kino-secondary hover:text-white transition">
      <span class="text-base">🎬</span>
      <span>Library</span>
    </a>
    <a href="tiers.html" class="flex flex-col items-center gap-1 text-xs text-kino-secondary hover:text-white transition">
      <span class="text-base">🏆</span>
      <span>Tiers</span>
    </a>
    <a href="matrix.html" class="flex flex-col items-center gap-1 text-xs text-kino-secondary hover:text-white transition">
      <span class="text-base">🧭</span>
      <span>Matrix</span>
    </a>
    <a href="add.html" class="flex flex-col items-center gap-1 text-xs text-kino-secondary hover:text-white transition">
      <span class="text-base">➕</span>
      <span>Add</span>
    </a>
  </nav>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal-card">
      <h3>Delete this review?</h3>
      <p id="delete-movie-title">This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancel-delete">Cancel</button>
        <button class="btn-danger" id="confirm-delete">Delete permanently</button>
      </div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
  <script type="module" src="/detail.js"></script>
</body>
</html>
