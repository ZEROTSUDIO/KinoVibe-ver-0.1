<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tier List — KinoVibe</title>
  <meta name="description" content="Automatic tier rankings of your movie reviews from S to F.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="library.html" class="nav-brand">
        <span class="brand-kino">Kino</span><span class="brand-vibe">Vibe</span>
      </a>
      <div class="nav-links">
        <a href="library.html" class="nav-link">Library</a>
        <a href="tiers.html" class="nav-link active">Tiers</a>
        <a href="matrix.html" class="nav-link">Matrix</a>
        <a href="add.html" class="nav-link nav-add">+ Add Movie</a>
      </div>
    </div>
  </nav>

  <main class="page-container" style="max-width:900px">
    <div class="page-header">
      <div>
        <h1>Tier List</h1>
        <div class="subtitle" id="tier-count">0 movies ranked</div>
      </div>
      <div class="flex items-center gap-2.5 flex-wrap">
        <a href="matrix.html" class="matrix-filter-btn inline-flex items-center gap-1.5 no-underline" title="Switch to 2D Quality vs. Entertainment Matrix">
          <span>🧭</span><span>Vibe Matrix ↗</span>
        </a>
        <div class="tier-view-toggle" id="tier-view-toggle" role="group" aria-label="Tier view mode">
          <button type="button" class="tier-view-btn active" data-view="posters" id="toggle-posters" title="Show movie posters">
            <span class="toggle-icon">🖼️</span>
            <span>Posters</span>
          </button>
          <button type="button" class="tier-view-btn" data-view="titles" id="toggle-titles" title="Show movie titles">
            <span class="toggle-icon">📝</span>
            <span>Titles</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Tag Filter Bar — populated by tiers.js -->
    <div class="tag-filter-bar hidden" id="tag-filter-bar"></div>

    <div class="loading-box hidden" id="loading-state">
      <div class="spinner"></div>
      <div>Loading tier list...</div>
    </div>

    <div id="tier-list" class="hidden"></div>

    <div class="empty-state hidden" id="empty-state">
      <div class="empty-icon">🏆</div>
      <div class="empty-title">No movies to rank</div>
      <div class="empty-subtitle">Add some reviews to see your tier list</div>
      <a href="add.html" class="btn-primary" style="text-decoration:none">Add your first movie</a>
    </div>
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="sm:hidden fixed bottom-0 left-0 right-0 z-50 bg-kino-surface/95 backdrop-blur-lg border-t border-white/[0.08] px-4 py-2 flex justify-around items-center">
    <a href="library.html" class="flex flex-col items-center gap-1 text-xs text-kino-secondary hover:text-white transition">
      <span class="text-base">🎬</span>
      <span>Library</span>
    </a>
    <a href="tiers.html" class="flex flex-col items-center gap-1 text-xs text-kino-accent-light font-semibold">
      <span class="text-base">🏆</span>
      <span>Tiers</span>
    </a>
    <a href="matrix.html" class="flex flex-col items-center gap-1 text-xs text-kino-secondary hover:text-white transition">
      <span class="text-base">🧭</span>
      <span>Matrix</span>
    </a>
    <a href="add.html" class="flex flex-col items-center gap-1 text-xs text-kino-secondary hover:text-white transition">
      <span class="text-base">➕</span>
      <span>Add</span>
    </a>
  </nav>

  <script type="module" src="/app.js"></script>
  <script type="module" src="/tiers.js"></script>
</body>
</html>
