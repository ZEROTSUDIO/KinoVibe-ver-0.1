<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Movie — KinoVibe</title>
  <meta name="description" content="Add a new movie review with story, visuals, action, and fun scores plus personal bias.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">
        <span class="brand-kino">Kino</span><span class="brand-vibe">Vibe</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Library</a>
        <a href="tiers.html" class="nav-link">Tiers</a>
        <a href="add.html" class="nav-link nav-add">+ Add Movie</a>
      </div>
    </div>
  </nav>

  <main class="page-container" style="max-width:760px">
    <div class="page-header">
      <div>
        <h1>Add Movie</h1>
        <div class="subtitle">Rate with your 4 criteria and personal bias</div>
      </div>
      <a href="index.html" class="btn-secondary">Cancel</a>
    </div>

    <form class="form-card" id="movie-form" data-mode="add">
      <input type="hidden" id="tmdb-id">
      <input type="hidden" id="backdrop-url">
      <input type="hidden" id="overview">
      <input type="hidden" id="genres">
      <input type="hidden" id="runtime">

      <div class="tmdb-search-box mb-4">
        <label class="form-label" for="tmdb-search">🎬 Search TMDB Movie</label>
        <div class="input-group">
          <input type="text" class="form-input" id="tmdb-search" placeholder="Type to search movie (e.g. Inception, Dune, Dark Knight...)" autocomplete="off">
          <button class="btn btn-outline-secondary text-light" type="button" id="tmdb-key-btn" title="API Key Settings">⚙️ API Key</button>
        </div>
        <div id="tmdb-results" class="tmdb-dropdown d-none"></div>
      </div>

      <div class="section-title">Details</div>
      <div class="row g-3">
        <div class="col-md-8">
          <div class="form-group">
            <label class="form-label" for="title">Title</label>
            <input type="text" class="form-input" id="title" placeholder="e.g. Mad Max: Fury Road" required>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="year">Year</label>
            <input type="number" class="form-input" id="year" placeholder="2024">
          </div>
        </div>
        <div class="col-12">
          <div class="form-group">
            <label class="form-label" for="poster-url">Poster URL <span class="optional">(optional)</span></label>
            <input type="text" class="form-input" id="poster-url" placeholder="https://...">
          </div>
        </div>
        <div class="col-12">
          <div class="form-group">
            <label class="form-label" for="review-text">Review <span class="optional">(optional)</span></label>
            <textarea class="form-textarea" id="review-text" rows="3" placeholder="What did you think?"></textarea>
          </div>
        </div>
      </div>

      <div class="section-title">Scores</div>
      <div class="slider-row">
        <div class="slider-header"><span class="slider-label">Story</span><span class="slider-value" id="story-val">5</span></div>
        <input type="range" id="story-score" min="0" max="10" step="0.5" value="5">
      </div>
      <div class="slider-row">
        <div class="slider-header"><span class="slider-label">Visuals</span><span class="slider-value" id="visuals-val">5</span></div>
        <input type="range" id="visuals-score" min="0" max="10" step="0.5" value="5">
      </div>
      <div class="slider-row">
        <div class="slider-header"><span class="slider-label">Action</span><span class="slider-value" id="action-val">5</span></div>
        <input type="range" id="action-score" min="0" max="10" step="0.5" value="5">
      </div>
      <div class="slider-row">
        <div class="slider-header"><span class="slider-label">Fun</span><span class="slider-value" id="fun-val">5</span></div>
        <input type="range" id="fun-score" min="0" max="10" step="0.5" value="5">
      </div>

      <div class="section-title">Bias</div>
      <div id="bias-container"></div>
      <button type="button" class="add-bias-btn" id="add-bias-btn">+ Add bias</button>

      <div class="score-preview" id="score-preview">
        <div>
          <div class="score-label">Calculated score</div>
          <div class="score-breakdown" id="score-breakdown">Base 5.0 &nbsp;·&nbsp; Bias +0 &nbsp;=&nbsp; Final</div>
        </div>
        <div class="score-big" id="score-final">5.0</div>
      </div>

      <div class="form-actions">
        <a href="index.html" class="btn-secondary">Cancel</a>
        <button type="submit" class="btn-primary">Save Movie</button>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script src="tmdb.js"></script>
  <script src="form.js"></script>
</body>
</html>
