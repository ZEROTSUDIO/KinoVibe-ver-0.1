<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — KinoVibe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">
        <span class="brand-kino">Kino</span><span class="brand-vibe">Vibe</span>
      </a>
    </div>
  </nav>

  <main class="auth-container">
    <div class="auth-card fade-in">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-signin">Sign In</button>
        <button class="auth-tab" id="tab-signup">Create Account</button>
      </div>

      <div class="auth-alert" id="auth-alert"></div>

      <form id="auth-form">
        <div class="form-group mb-3">
          <label class="form-label" for="auth-email">Email</label>
          <input type="email" class="form-input" id="auth-email" placeholder="you@example.com" required>
        </div>

        <div class="form-group mb-4">
          <label class="form-label" for="auth-password">Password</label>
          <input type="password" class="form-input" id="auth-password" placeholder="••••••••" required minlength="6">
        </div>

        <button type="submit" class="btn-primary w-100" id="auth-submit-btn">Sign In</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script src="login.js"></script>
</body>
</html>
