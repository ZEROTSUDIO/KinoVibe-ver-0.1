<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit — Mad Max: Fury Road</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar-mrv">
  <div class="container d-flex justify-content-between align-items-center">
    <a href="index.html" class="brand">MOVIE<span>REVIEW</span></a>
    <div>
      <a href="index.html" class="nav-link">Library</a>
      <a href="add.html" class="nav-link">Add movie</a>
    </div>
  </div>
</nav>

<div class="container" style="max-width:760px">

  <div class="page-head">
    <div>
      <h1>Edit review</h1>
      <div class="sub">Mad Max: Fury Road (2015)</div>
    </div>
    <a href="view.html" class="btn-outline-mrv">Cancel</a>
  </div>

  <form class="form-card mb-5">

    <div class="section-title">Details</div>
    <div class="row g-3 mb-2">
      <div class="col-md-8">
        <label class="form-label-mrv">Title</label>
        <input type="text" class="form-control form-control-mrv" value="Mad Max: Fury Road">
      </div>
      <div class="col-md-4">
        <label class="form-label-mrv">Year</label>
        <input type="number" class="form-control form-control-mrv" value="2015">
      </div>
      <div class="col-12">
        <label class="form-label-mrv">Poster URL <span class="text-muted fw-normal">(optional)</span></label>
        <input type="text" class="form-control form-control-mrv" placeholder="https://...">
      </div>
      <div class="col-12">
        <label class="form-label-mrv">Review <span class="text-muted fw-normal">(optional)</span></label>
        <textarea class="form-control form-control-mrv" rows="3" placeholder="What did you think?"></textarea>
      </div>
    </div>

    <div class="section-title">Scores</div>

    <div class="slider-row">
      <div class="slider-top"><span>Story</span><span class="val">7</span></div>
      <input type="range" class="mrv-range" min="0" max="10" step="1" value="7">
    </div>
    <div class="slider-row">
      <div class="slider-top"><span>Visuals</span><span class="val">9</span></div>
      <input type="range" class="mrv-range" min="0" max="10" step="1" value="9">
    </div>
    <div class="slider-row">
      <div class="slider-top"><span>Action</span><span class="val">8</span></div>
      <input type="range" class="mrv-range" min="0" max="10" step="1" value="8">
    </div>
    <div class="slider-row mb-1">
      <div class="slider-top"><span>Fun</span><span class="val">8</span></div>
      <input type="range" class="mrv-range" min="0" max="10" step="1" value="8">
    </div>

    <div class="section-title">Bias</div>

    <div class="bias-row">
      <input type="text" class="bias-amount pos" value="+3">
      <input type="text" class="bias-reason" value="Amazing final fight">
      <button type="button" class="bias-remove">&times;</button>
    </div>
    <div class="bias-row">
      <input type="text" class="bias-amount neg" value="-1">
      <input type="text" class="bias-reason" value="Weak dialogue in act two">
      <button type="button" class="bias-remove">&times;</button>
    </div>
    <a href="#" class="add-bias-link">+ Add bias</a>

    <div class="score-preview">
      <div>
        <div class="label">Calculated score</div>
        <div class="breakdown">Base 8.0 &nbsp;+&nbsp; Bias +2 &nbsp;=&nbsp; Final</div>
      </div>
      <div class="num">8.5</div>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
      <a href="view.html" class="btn-outline-mrv">Cancel</a>
      <button type="submit" class="btn-purple">Save changes</button>
    </div>

  </form>
</div>

</body>
</html>
