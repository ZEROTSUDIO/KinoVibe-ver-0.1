<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Library — KinoVibe</title>
  <meta name="description" content="Your personal movie review library. Rate films on Story, Visuals, Action, and Fun with a personal bias system.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">
        <span class="brand-kino">Kino</span><span class="brand-vibe">Vibe</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link active">Library</a>
        <a href="tiers.html" class="nav-link">Tiers</a>
        <a href="add.html" class="nav-link nav-add">+ Add Movie</a>
      </div>
    </div>
  </nav>

  <main class="page-container" style="max-width:1100px">
    <div class="page-header">
      <div>
        <h1>Your Library</h1>
        <div class="subtitle" id="movie-count">0 movies logged</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <select class="form-select" id="sort-select" style="width:auto">
          <option value="newest">Newest first</option>
          <option value="highest">Highest score</option>
          <option value="lowest">Lowest score</option>
          <option value="title">Title A–Z</option>
        </select>
        <a href="add.html" class="btn-primary" style="text-decoration:none">+ Add Movie</a>
      </div>
    </div>

    <div class="loading-box hidden" id="loading-state">
      <div class="spinner"></div>
      <div>Loading your reviews...</div>
    </div>

    <div class="row g-3 mb-5 hidden" id="movie-grid"></div>

    <div class="empty-state hidden" id="empty-state">
      <div class="empty-icon">🎬</div>
      <div class="empty-title">No movies yet</div>
      <div class="empty-subtitle">Start building your personal review library</div>
      <a href="add.html" class="btn-primary" style="text-decoration:none">Add your first movie</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script src="library.js"></script>
</body>
</html>
